repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: update-readme-stats
        name: update README stats
        entry: uv run python -c
        args:
          - |
            from pathlib import Path

            ROOT = Path(".")
            README = ROOT / "README.md"
            START = "<!-- stats:start -->"
            END = "<!-- stats:end -->"
            LEVELS = (("easy", "1f883d"), ("medium", "bf8700"), ("hard", "cf222e"))
            INTERVIEW_COLORS = ("8250df", "1f883d", "bf8700", "cf222e", "0969da")

            def count_python_files(path):
                directory = ROOT / path
                if not directory.exists():
                    return 0
                return sum(1 for file in directory.glob("*.py") if file.is_file())

            def badge(label, count, color):
                return f"![{label}](https://img.shields.io/badge/{label.lower()}-{count}-{color})"

            leetcode_counts = {
                level: count_python_files(Path("leetcode") / level)
                for level, _ in LEVELS
            }
            leetcode_total = sum(leetcode_counts.values())
            leetcode_badges = [badge("LeetCode", leetcode_total, "0969da")]
            leetcode_badges.extend(
                badge(level.capitalize(), leetcode_counts[level], color)
                for level, color in LEVELS
            )

            interviews = ROOT / "interviews"
            categories = sorted(path for path in interviews.iterdir() if path.is_dir())
            interview_counts = {
                path.name: count_python_files(path.relative_to(ROOT))
                for path in categories
            }
            interviews_total = sum(interview_counts.values())
            interview_badges = [badge("Interviews", interviews_total, "0969da")]
            interview_badges.extend(
                badge(
                    category,
                    count,
                    INTERVIEW_COLORS[index % len(INTERVIEW_COLORS)],
                )
                for index, (category, count) in enumerate(interview_counts.items())
            )

            total = leetcode_total + interviews_total
            stats = f"""\
            {START}

            {badge("Total", total, "2ea44f")}

            {"\n".join(leetcode_badges)}

            {" ".join(interview_badges)}

            {END}"""
            stats = "\n".join(line.removeprefix("            ") for line in stats.splitlines())

            readme = README.read_text()
            if START in readme and END in readme:
                before, rest = readme.split(START, maxsplit=1)
                _, after = rest.split(END, maxsplit=1)
                updated = f"{before.rstrip()}\n\n{stats}{after}"
            else:
                updated = f"{readme.rstrip()}\n\n{stats}\n"

            if updated != readme:
                README.write_text(updated)
        language: system
        pass_filenames: false
        always_run: true

      - id: ty-check
        name: ty check
        entry: uv run ty check --output-format concise .
        language: system
        pass_filenames: false
        types: [python]
